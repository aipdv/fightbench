name: Deploy board

# Builds site/board.json from results/verified/ and publishes site/ to the Cloudflare Pages project "fightbench"
# (https://fightbench.aipdv.com). Merges to main go to production. Pull requests from this repo get a preview URL.
# Nobody edits board.json by hand: commit a replayed result and this workflow does the rest.
on:
  push:
    branches: [main]
    paths: [site/**, results/verified/**, submissions/**, fightbench.py, .github/workflows/deploy-site.yml]
  pull_request:
    paths: [site/**, results/verified/**, submissions/**, fightbench.py, .github/workflows/deploy-site.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-board-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Fork PRs get no secrets, so they skip the preview.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No ROM needed: the board reads replayed rounds and submissions only.
      - run: python3 fightbench.py board
      - run: cp recording/veryhard-win-shang-tsung-2.webp site/replay.webp
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name fightbench --branch ${{ github.head_ref || github.ref_name }}
