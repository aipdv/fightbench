name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No ROM and no network: the checks cover the frozen edition, validation, and replay with a fake emulator.
      - run: python3 test_mk2_clef.py
